version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-net

  backend:
    build:
      context: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - ecommerce-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mongo-data:
