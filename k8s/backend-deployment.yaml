apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-backend
  labels:
    app: shopsphere-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsphere-backend
  template:
    metadata:
      labels:
        app: shopsphere-backend
    spec:
      containers:
        - name: backend
          image: <DOCKERHUB_USERNAME>/shopsphere-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: mongo-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: shopsphere-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
