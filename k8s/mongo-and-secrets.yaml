# Create the actual secret imperatively instead of committing real values:
#
#   kubectl create secret generic shopsphere-secrets \
#     --from-literal=mongo-uri='mongodb://mongo:27017/ecommerce' \
#     --from-literal=jwt-secret='replace-with-a-long-random-string'
#
# This file is a reference template only - do NOT put real secrets in git.
apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-secrets
type: Opaque
stringData:
  mongo-uri: mongodb://mongo:27017/ecommerce
  jwt-secret: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
